name: Kubernetes Manifests Validation

on:
  push:
    paths:
      - 'k8s/**'
      - 'helm/**'
      - '.github/workflows/k8s-validate.yml'
  pull_request:
    paths:
      - 'k8s/**'
      - 'helm/**'
      - '.github/workflows/k8s-validate.yml'

jobs:
  validate-k8s:
    name: Validate Kubernetes YAML & Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: |
          helm lint helm/hrms-lite/

      - name: Validate K8s Manifests with Kubectl Dry-Run
        run: |
          # Use microk8s/kind or dry-run validation
          for f in k8s/*.yaml; do
            echo "Checking syntax of $f..."
            python3 -c "import yaml; yaml.safe_load_all(open('$f'))" || exit 1
          done
          echo "✅ All Kubernetes manifests are valid YAML!"
