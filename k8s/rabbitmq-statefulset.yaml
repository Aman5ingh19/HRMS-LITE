apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hrms-rabbitmq
  namespace: hrms
  labels:
    app: hrms-rabbitmq
spec:
  serviceName: hrms-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: hrms-rabbitmq
  template:
    metadata:
      labels:
        app: hrms-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-rabbitmq
  namespace: hrms
spec:
  ports:
    - port: 5672
      name: amqp
      targetPort: 5672
    - port: 15672
      name: management
      targetPort: 15672
  selector:
    app: hrms-rabbitmq
