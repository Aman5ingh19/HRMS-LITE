apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-config
  namespace: hrms
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  REDIS_URL: "redis://hrms-redis:6379/1"
  RABBITMQ_HOST: "hrms-rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_ENABLED: "True"
  KAFKA_BOOTSTRAP_SERVERS: "hrms-kafka:9092"
  KAFKA_ENABLED: "True"
  N8N_WEBHOOK_ENABLED: "True"
  N8N_WEBHOOK_BASE_URL: "http://hrms-n8n:5678/webhook"
